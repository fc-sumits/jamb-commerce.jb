(function(){
  "use strict";
  const LETTERS = ["A","B","C","D"];
  const ALL = RAW.trim().split("\n").filter(l => l.trim().length).map(line => {
    const p = line.split("|");
    return { y:p[0].trim(), q:p[1].trim(), o:[p[2].trim(),p[3].trim(),p[4].trim(),p[5].trim()], a:LETTERS.indexOf(p[6].trim()), e:p[7].trim() };
  });
  const SET_COUNT = 10;
  const PER_SET = Math.ceil(ALL.length / SET_COUNT);
  const SETS = [];
  for (let i=0;i<SET_COUNT;i++) SETS.push(ALL.slice(i*PER_SET,(i+1)*PER_SET));
  const $ = id => document.getElementById(id);
  function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  const STORE_KEY = "jamb_commerce_progress_v1";
  function loadProgress(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{}}catch(e){return{}}}
  function saveProgress(o){try{localStorage.setItem(STORE_KEY,JSON.stringify(o))}catch(e){}}
  let progress = loadProgress();
  const state = { setIndex:null, order:[], idx:0, answers:{}, shuffled:{}, finished:false };

  function renderHome(){
    $("home").classList.remove("hidden");
    $("quiz").classList.add("hidden");
    $("result").classList.add("hidden");
    const grid = $("setGrid"); grid.innerHTML = "";
    SETS.forEach((set,i)=>{
      const best = progress[i]||0;
      const card = document.createElement("button");
      card.className = "set-card";
      card.innerHTML = `<div class="num">SET ${i+1}</div><div class="lbl">Questions ${i*PER_SET+1} – ${Math.min((i+1)*PER_SET,ALL.length)}</div><div class="lbl" style="color:var(--gold);font-weight:700;margin-top:6px">${best?"Best: "+best+"%":"Not attempted"}</div><div class="prog"><i style="width:${best}%"></i></div>`;
      card.addEventListener("click",()=>startSet(i));
      grid.appendChild(card);
    });
    $("totalInfo").textContent = ALL.length+" Questions";
  }
  function startSet(i){
    state.setIndex=i;
    state.order=shuffle([...Array(SETS[i].length).keys()]);
    state.idx=0; state.answers={}; state.shuffled={}; state.finished=false;
    $("home").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
    $("setLabel").textContent = "Set "+(i+1);
    renderQuestion(); window.scrollTo({top:0,behavior:"smooth"});
  }
  function currentQuestion(){
    const realIndex = state.order[state.idx];
    const q = SETS[state.setIndex][realIndex];
    if (!state.shuffled[realIndex]){
      const correctText = q.o[q.a];
      const opts = shuffle(q.o);
      state.shuffled[realIndex] = { opts, correctPos: opts.indexOf(correctText) };
    }
    return { q, realIndex, sh: state.shuffled[realIndex] };
  }
  function renderQuestion(){
    const { q, realIndex, sh } = currentQuestion();
    $("yearBadge").textContent = "JAMB "+q.y;
    $("qCounter").textContent = "Q "+(state.idx+1)+" / "+state.order.length;
    $("qText").textContent = q.q;
    $("progressFill").style.width = (state.idx/state.order.length)*100+"%";
    let score=0; Object.values(state.answers).forEach(a=>{if(a.chosen===a.correct)score++});
    $("liveScore").textContent = "Score: "+score;
    const box = $("opts"); box.innerHTML = "";
    const answered = state.answers[realIndex];
    const correctPos = sh.correctPos;
    sh.opts.forEach((text,pos)=>{
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.innerHTML = `<span class="key">${LETTERS[pos]}</span><span>${text}</span>`;
      if (answered){
        btn.classList.add("locked");
        if (pos===correctPos) btn.classList.add("correct");
        else if (pos===answered.chosen) btn.classList.add("wrong");
        else btn.classList.add("dim");
      } else {
        btn.addEventListener("click",()=>choose(pos,correctPos,realIndex));
      }
      box.appendChild(btn);
    });
    const exBox = $("explainBox"); exBox.innerHTML = "";
    if (answered) exBox.innerHTML = buildExplanation(answered,correctPos,q,sh);
    $("prevBtn").disabled = state.idx===0;
    const isLast = state.idx===state.order.length-1;
    $("nextBtn").textContent = isLast ? "Finish Set ✓" : "Next →";
  }
  function buildExplanation(answered,correctPos,q,sh){
    const isCorrect = answered.chosen===correctPos;
    const correctLetter = LETTERS[correctPos];
    const chosenLetter = LETTERS[answered.chosen];
    const correctText = sh.opts[correctPos];
    const verdict = isCorrect ? `<div class="head">✅ Correct!</div>` : `<div class="head">❌ Not quite — you chose ${chosenLetter}</div>`;
    return `<div class="explain ${isCorrect?"ok":"no"}">${verdict}<div class="ansline">Answer: ${correctLetter}. ${correctText}</div><div class="body">${q.e}</div></div>`;
  }
  function choose(pos,correctPos,realIndex){
    state.answers[realIndex] = { chosen:pos, correct:correctPos };
    renderQuestion();
  }
  $("nextBtn").addEventListener("click",()=>{
    if (state.idx<state.order.length-1){ state.idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
    else finishSet();
  });
  $("prevBtn").addEventListener("click",()=>{
    if (state.idx>0){ state.idx--; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
  });
  $("backBtn").addEventListener("click",()=>{
    if (confirm("Leave this set? Your answers for this attempt will be lost.")) renderHome();
  });
  function finishSet(){
    const total = state.order.length;
    let score=0; Object.values(state.answers).forEach(a=>{if(a.chosen===a.correct)score++});
    const pct = Math.round((score/total)*100);
    const prevBest = progress[state.setIndex]||0;
    if (pct>prevBest){ progress[state.setIndex]=pct; saveProgress(progress); }
    $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
    $("ringTxt").textContent = pct+"%";
    $("ring").style.background = `conic-gradient(var(--gold) ${pct*3.6}deg, #0d1730 ${pct*3.6}deg)`;
    $("resTitle").textContent = pct>=70?"Excellent Work! 🎉":pct>=50?"Good Effort! 👍":"Keep Practising 💪";
    $("resText").textContent = `You scored ${score} out of ${total} in Set ${state.setIndex+1}.`;
    window.scrollTo({top:0,behavior:"smooth"});
  }
  $("retryBtn").addEventListener("click",()=>startSet(state.setIndex));
  $("homeBtn").addEventListener("click",renderHome);
  $("reviewBtn").addEventListener("click",()=>{
    state.idx=0;
    $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
    renderQuestion();
  });
  renderHome();
  if ("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(err => console.log("SW failed:", err));
    });
  }
})();
</script>
